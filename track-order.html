<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BiteOrbit Live Tracking</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/track-order.css">
    <link rel="stylesheet" href="css/loader.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/tracking.css">
    <link rel="stylesheet" href="css/live-map.css">
    <link rel="stylesheet" href="css/ai-assistant.css">

    <style>
        body {
            background: #0f172a;
            color: white;
        }

        /* MAIN CARD */
        .tracking-card {
            max-width: 1100px;
            margin: auto;
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }

        /* MAP FIX (IMPORTANT) */
        #map {
            height: 420px;
            width: 100%;
            border-radius: 20px;
            margin-top: 10px;
        }

        /* HEADER */
        .tracking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ORDER BOX */
        .order-id-box {
            background: linear-gradient(135deg, #00c853, #00e676);
            padding: 10px 20px;
            border-radius: 15px;
        }

        /* STATUS */
        .status-box {
            margin-top: 15px;
        }

        /* RIDER */
        .rider-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
        }

        /* CHAT */
        .chat-container {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 20px;
        }

        /* TRAFFIC */
        .traffic-box {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
        }
    </style>

</head>

<body>

    <!-- LOADER -->
    <div id="loader-container"></div>

    <!-- TOAST -->
    <div id="toast-box"></div>

    <!-- MAIN -->
    <section class="tracking-section">

        <div class="tracking-card">

            <!-- HEADER -->
            <div class="tracking-header">

                <div>
                    <h1>Live Tracking 🚀</h1>
                    <p>Your order is on the way</p>
                </div>

                <div class="order-id-box">
                    ORDER ID <br>
                    <strong id="tracking-order-id">#0000</strong>
                </div>

            </div>

            <!-- STATUS -->
            <div class="status-box">
                <h2 id="order-status">Preparing</h2>
                <p id="eta-text">Calculating ETA...</p>
            </div>

            <!-- MAP -->
            <div class="map-wrapper">
                <div id="map"></div>
            </div>

            <!-- RIDER -->
            <div class="rider-box">
                <div>
                    <h4 id="rider-name">Rider Name</h4>
                    <p id="rider-mobile">+91 XXXXX</p>
                </div>

                <div>🛵 LIVE</div>
            </div>

            <!-- CHAT -->
            <div class="chat-container">

                <div class="chat-header">Chat 💬</div>

                <div id="chat-messages"></div>

                <div class="chat-input-box">
                    <input type="text" id="chat-input" placeholder="Message...">
                    <button id="send-btn">Send</button>
                </div>

            </div>

            <!-- TRAFFIC -->
            <div class="traffic-box">
                Traffic: <span id="traffic-level">Normal</span>
            </div>

        </div>

    </section>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

    <script src="js/includes.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/tracking.js"></script>
    <script src="js/live-map.js"></script>

</body>

</html>
