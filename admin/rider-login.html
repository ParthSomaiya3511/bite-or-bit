<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>

        BiteOrbit Rider Login

    </title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- FontAwesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- CSS -->

    <link rel="stylesheet" href="../admin/css/rider-login.css">

    <link
        rel="stylesheet"
        href="../admin/css/success-animation.css"
    >

</head>

<body>

    <!-- FLOATING ICONS -->

    <div class="floating-icons">

        <span>🍔</span>

        <span>🍕</span>

        <span>🥤</span>

        <span>🛵</span>

        <span>🍟</span>

    </div>

    <!-- LOGIN SECTION -->

    <section class="login-section">

        <div class="login-card">

            <!-- LOGO -->

            <div class="logo-box">

                <div class="logo-circle">

                    🍔

                </div>

                <h1>

                    BiteOrbit

                </h1>

                <p>

                    Rider Partner Dashboard
                </p>

            </div>

            <!-- FORM -->

            <form id="login-form">

                <!-- EMAIL -->

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter Email"
                        required
                    >

                </div>

                <!-- PASSWORD -->

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter Password"
                        required
                    >

                </div>

                <!-- BUTTON -->

                <button
                    type="submit"
                    class="login-btn"
                >

                    <span>

                        Login Dashboard

                    </span>

                </button>

            </form>

        </div>

    </section>

    <!-- CONFETTI -->

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- LOGIN JS -->

    <script src="../admin/js/rider-login.js"></script>


</body>

</html>
