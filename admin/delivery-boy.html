<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Delivery Boy GPS
</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{

    background:#0f172a;

    color:white;
}

.card-box{

    background:#111827;

    padding:40px;

    border-radius:25px;

    margin-top:100px;
}

</style>

</head>

<body>

<div class="container">

    <div class="card-box">

        <h1 class="mb-4">

            Delivery Boy Tracking

        </h1>

        <button
            class="btn btn-success btn-lg"

            onclick="startTracking()"
        >

            Start Live GPS

        </button>

        <div id="status"
        class="mt-4"></div>

    </div>

</div>

<script>

const orderId = 1

function startTracking(){

    document.getElementById(

        "status"

    ).innerHTML = "GPS Started..."

    navigator.geolocation.watchPosition(

        async(position)=>{

            const latitude =
                position.coords.latitude

            const longitude =
                position.coords.longitude

            console.log(latitude, longitude)

            document.getElementById(

                "status"

            ).innerHTML = `

                Latitude: ${latitude}
                <br>
                Longitude: ${longitude}

            `

            await fetch(

                "http://127.0.0.1:8000/api/orders/delivery-location/",

                {

                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({

                        order_id:orderId,

                        latitude:latitude,

                        longitude:longitude
                    })
                }
            )

        },

        (error)=>{

            console.log(error)
        },

        {

            enableHighAccuracy:true
        }
    )
}

</script>

</body>
</html>
