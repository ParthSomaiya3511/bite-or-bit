<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Rider Dashboard
    </title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- External CSS -->

    <link rel="stylesheet" href="../admin/css/rider-dashboard.css">

</head>

<body>

    <!-- =========================================
SIDEBAR
========================================= -->

    <div class="sidebar">

        <div>

            <div class="brand-logo">

                🍔 BiteOrbit
            </div>

            <ul class="sidebar-menu">

                <li class="active">

                    <i class="fa-solid fa-house"></i>

                    Dashboard

                </li>

                <li>

                    <i class="fa-solid fa-motorcycle"></i>

                    Live Orders

                </li>

                <li>

                    <i class="fa-solid fa-wallet"></i>

                    Wallet

                </li>

                <li>

                    <i class="fa-solid fa-clock-rotate-left"></i>

                    History

                </li>

                <li>

                    <i class="fa-solid fa-gear"></i>

                    Settings

                </li>

            </ul>

        </div>

        <button class="logout-btn">

            Logout

        </button>

    </div>


    <!-- =========================================
MAIN CONTENT
========================================= -->

    <div class="main-content">

        <!-- TOPBAR -->

        <div class="topbar">

            <div>

                <h2 class="fw-bold">

                    Rider Dashboard 🚀

                </h2>

                <small class="text-secondary">

                    <span id="rider-name"></span>
                </small>

            </div>

            <div class="online-toggle">

                <span id="online-text">

                    Offline
                </span>

                <label class="switch">

                    <input type="checkbox" id="online-toggle">

                    <span class="slider"></span>

                </label>

            </div>

        </div>


        <!-- =========================================
STATS CARDS
========================================= -->

        <div class="stats-grid">

            <div class="stat-card">

                <h5>

                    Earnings

                </h5>

                <h2 id="earnings">

                    ₹0

                </h2>

            </div>

            <div class="stat-card">

                <h5>

                    Orders

                </h5>

                <h2 id="orders-count">

                    0

                </h2>

            </div>

            <div class="stat-card">

                <h5>

                    Completed

                </h5>

                <h2 id="completed-orders">

                    0

                </h2>

            </div>

            <div class="stat-card">

                <h5>

                    Availability

                </h5>

                <h2 id="availability-status">

                    Offline

                </h2>

            </div>

        </div>



        <!-- =========================================
LIVE ORDERS
========================================= -->

        <div class="orders-section">

            <div class="section-header">

                <h3>

                    Live Orders

                </h3>

                <button class="refresh-btn" onclick="loadOrders()">

                    Refresh
                </button>

            </div>

            <div id="orders-container">

                <!-- Dynamic Orders -->

            </div>

            <!-- CHAT -->

            <div class="chat-container">

                <div class="chat-header">

                    Customer Chat 💬

                </div>

                <div id="rider-chat-messages">

                </div>

                <div class="chat-input-box">

                    <input type="text" id="rider-chat-input" placeholder="Reply to customer...">

                    <button id="rider-send-btn">

                        Send

                    </button>

                </div>

            </div>


        </div>

        <div class="delivery-actions">

            <button id="sos-btn">

                🚨 EMERGENCY SOS

            </button>

        </div>

    </div>


    <!-- =========================================
TOAST
========================================= -->

    <div id="toast-box"></div>


    <!-- =========================================
JS
========================================= -->

    <script src="/js/rider-dashboard.js"></script>

    <script src="js/rider-live-location.js"></script>

</body>

</html>
