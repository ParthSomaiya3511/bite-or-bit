<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Rider GPS Tracking
    </title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Leaflet -->

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>

        body {

            background: #0f172a;

            color: white;
        }

        #map {

            height: 90vh;

            border-radius: 25px;
        }

        .topbar {

            background: #111827;

            padding: 20px;

            margin-bottom: 20px;

            border-radius: 20px;
        }

    </style>

</head>

<body>

<div class="container-fluid p-4">

    <div class="topbar d-flex
                justify-content-between
                align-items-center">

        <h2>

            🚴 Rider Live GPS

        </h2>

        <button class="btn btn-success"
                onclick="startTracking()">

            Start GPS
        </button>

    </div>

    <div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="../js/rider-gps.js"></script>

</body>

</html>
