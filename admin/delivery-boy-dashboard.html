<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Delivery Boy Dashboard
    </title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- FontAwesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body {

            background: #0b1220;

            color: white;

            font-family: sans-serif;
        }

        .sidebar {

            width: 270px;

            height: 100vh;

            background: #111827;

            position: fixed;

            padding: 30px;
        }

        .sidebar h2 {

            color: #10b981;

            font-weight: bold;
        }

        .sidebar a {

            display: block;

            color: #cbd5e1;

            text-decoration: none;

            padding: 15px;

            border-radius: 12px;

            margin-bottom: 10px;

            transition: 0.3s;
        }

        .sidebar a:hover {

            background: #10b981;

            color: white;
        }

        .main {

            margin-left: 290px;

            padding: 30px;
        }

        .card-box {

            background: #111827;

            padding: 25px;

            border-radius: 25px;

            margin-bottom: 25px;
        }

        .status-badge {

            padding: 10px 20px;

            border-radius: 50px;

            background: #10b981;

            color: white;

            font-weight: bold;
        }

        .order-card {

            background: #1e293b;

            border-radius: 20px;

            padding: 20px;

            margin-bottom: 20px;
        }

        .btn-custom {

            background: #10b981;

            border: none;

            padding: 10px 20px;

            border-radius: 12px;

            color: white;
        }

        .btn-custom:hover {

            background: #059669;
        }

        @media(max-width:768px){

            .sidebar{

                width:100%;

                height:auto;

                position:relative;
            }

            .main{

                margin-left:0;
            }
        }

    </style>

</head>

<body>

    <!-- SIDEBAR -->

    <div class="sidebar">

        <h2>
            BiteOrbit Rider
        </h2>

        <hr>

        <a href="#">

            <i class="fa-solid fa-house"></i>

            Dashboard
        </a>

        <a href="#orders">

            <i class="fa-solid fa-box"></i>

            Orders
        </a>

        <a href="#earnings">

            <i class="fa-solid fa-wallet"></i>

            Earnings
        </a>

        <a href="#profile">

            <i class="fa-solid fa-user"></i>

            Profile
        </a>

    </div>

    <!-- MAIN -->

    <div class="main">

        <!-- TOP -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h1 class="fw-bold">

                    Delivery Dashboard
                </h1>

                <p class="text-secondary">

                    Welcome Rider 🚀
                </p>

            </div>

            <div class="status-badge">

                Online
            </div>

        </div>

        <!-- STATS -->

        <div class="row">

            <div class="col-md-4">

                <div class="card-box">

                    <h5>
                        Today's Orders
                    </h5>

                    <h1 id="today-orders">
                        0
                    </h1>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card-box">

                    <h5>
                        Earnings
                    </h5>

                    <h1>

                        ₹ <span id="today-earnings">
                            0
                        </span>

                    </h1>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card-box">

                    <h5>
                        Completed
                    </h5>

                    <h1 id="completed-orders">
                        0
                    </h1>

                </div>

            </div>

        </div>

        <!-- ORDERS -->

        <div class="card-box mt-4">

            <div class="d-flex justify-content-between">

                <h3>
                    Assigned Orders
                </h3>

                <button class="btn btn-custom"
                        onclick="loadOrders()">

                    Refresh
                </button>

            </div>

            <div id="orders-container"
                 class="mt-4">

            </div>

        </div>

    </div>

    <script src="js/delivery-boy.js"></script>

</body>

</html>
