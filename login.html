<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BiteOrbit Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/loader.css">

    <link rel="stylesheet" href="../css/toast.css">

    <link rel="stylesheet" href="./admin/css/success-animation.css">

</head>

<body class="dark-theme">

    <div id="loader-container"></div>

    <div id="toast-box"></div>

    <section class="min-vh-100 d-flex align-items-center">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-5">

                    <div class="checkout-card p-5">

                        <div class="text-center mb-5">

                            <h1 class="fw-800">

                                Welcome Back
                            </h1>

                            <p class="text-slate">

                                Login to your BiteOrbit account
                            </p>

                        </div>

                        <div class="mb-4">

                            <label class="mb-2">
                                Username
                            </label>

                            <input id="username" class="form-control premium-input" placeholder="Enter username">

                        </div>

                        <div class="mb-4">

                            <label class="mb-2">
                                Password
                            </label>

                            <input id="password" type="password" class="form-control premium-input"
                                placeholder="Enter password">

                        </div>

                        <button class="place-order-btn" onclick="loginUser()">

                            Login Now

                        </button>

                        <div class="text-center mt-4">

                            <span class="text-slate">
                                New User ?
                            </span>

                            <a href="register.html" class="text-teal text-decoration-none">

                                Create Account

                            </a>

                        </div>

                        <p id="msg" class="mt-4 text-center"></p>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <script src="js/script.js"></script>

    <script src="../js/includes.js"></script>

    <script src="../js/loader.js"></script>

    <script src="../js/toast.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script src="./admin/js/success-animation.js"></script>

    <!-- AI ASSISTANT -->

    <div id="ai-assistant"></div>

    <script>

        fetch("components/ai-assistant.html")

            .then(response => response.text())

            .then(data => {

                document.getElementById(
                    "ai-assistant"
                ).innerHTML = data
            })
    </script>

    <link rel="stylesheet" href="css/ai-assistant.css">

    <script src="js/ai-assistant.js"></script>

</body>

</html>
