<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BiteOrbit Checkout</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/loader.css">

    <link rel="stylesheet" href="../css/toast.css">

</head>

<body class="dark-theme">

    <div id="loader-container"></div>

    <div id="toast-box"></div>
    <div id="header"></div>

    <!-- Checkout -->
    <section class="checkout-section">

        <div class="container">

            <div class="row g-5">

                <!-- Left -->
                <div class="col-lg-8">

                    <!-- Delivery Address -->
                    <div class="checkout-card">

                        <h3 class="checkout-title">
                            Delivery Address
                        </h3>

                        <div class="row g-4">

                            <div class="col-md-6">

                                <input type="text" id="customer-name" class="form-control premium-input"
                                    placeholder="Full Name">


                            </div>

                            <div class="col-md-6">

                                <input type="text" id="customer-mobile" class="form-control premium-input"
                                    placeholder="Mobile Number">

                            </div>

                            <div class="col-12">

                                <textarea id="customer-address" class="form-control premium-input" rows="4"
                                    placeholder="Full Address"></textarea>

                            </div>

                            <div class="col-md-6">

                                <input type="text" id="customer-city" class="form-control premium-input"
                                    placeholder="City">

                            </div>

                            <div class="col-md-6">

                                <input type="text" id="customer-pincode" class="form-control premium-input"
                                    placeholder="Pincode">

                            </div>

                        </div>

                    </div>

                    <!-- Payment -->
                    <div class="checkout-card mt-4">

                        <h3 class="checkout-title">
                            Payment Method
                        </h3>

                        <!-- UPI -->
                        <div class="payment-option active-payment">

                            <div class="d-flex align-items-center">

                                <input type="radio" checked class="form-check-input me-3">

                                <div>

                                    <h5>
                                        UPI Payment
                                    </h5>

                                    <small>
                                        Google Pay, PhonePe, Paytm
                                    </small>

                                </div>

                            </div>

                            <i class="fa-brands fa-google-pay payment-icon"></i>

                        </div>

                        <!-- Card -->
                        <div class="payment-option">

                            <div class="d-flex align-items-center">

                                <input type="radio" class="form-check-input me-3">

                                <div>

                                    <h5>
                                        Credit / Debit Card
                                    </h5>

                                    <small>
                                        Visa, Mastercard, RuPay
                                    </small>

                                </div>

                            </div>

                            <i class="fa-regular fa-credit-card payment-icon"></i>

                        </div>

                        <!-- COD -->
                        <div class="payment-option">

                            <div class="d-flex align-items-center">

                                <input type="radio" class="form-check-input me-3">

                                <div>

                                    <h5>
                                        Cash On Delivery
                                    </h5>

                                    <small>
                                        Pay when order arrives
                                    </small>

                                </div>

                            </div>

                            <i class="fa-solid fa-money-bill-wave payment-icon"></i>

                        </div>

                    </div>

                </div>

                <!-- Right -->
                <div class="col-lg-4">

                    <div class="checkout-summary sticky-top">

                        <h3>
                            Order Summary
                        </h3>

                        <hr>

                        <!-- Dynamic Checkout Items -->
                        <div id="checkout-items">

                        </div>

                        <hr>

                        <!-- Promo -->
                        <div class="promo-box">

                            <input type="text" class="promo-input" placeholder="Promo Code">

                            <button class="btn apply-btn">
                                Apply
                            </button>

                        </div>

                        <!-- Bill -->
                        <div class="bill-area">

                            <div class="bill-row">

                                <span>
                                    Subtotal
                                </span>

                                <span id="subtotal">
                                    ₹0
                                </span>

                            </div>

                            <div class="bill-row">

                                <span>
                                    Delivery Fee
                                </span>

                                <span class="text-success">
                                    FREE
                                </span>

                            </div>

                            <div class="bill-row">

                                <span>
                                    Taxes
                                </span>

                                <span>
                                    ₹49
                                </span>

                            </div>

                            <hr>

                            <div class="bill-row total-bill">

                                <span>
                                    Total
                                </span>

                                <span id="final-total">
                                    ₹0
                                </span>

                            </div>

                        </div>

                        <!-- Checkout -->
                        <button class="btn place-order-btn" onclick="placeOrder()">

                            Place Order

                            <i class="fa-solid fa-arrow-right ms-2"></i>

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <div id="footer"></div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/script.js"></script>

    <script type="module" src="js/firebase.js"></script>

    <script src="../js/includes.js"></script>

    <script src="../js/loader.js"></script>

    <script src="../js/toast.js"></script>

    <!-- AI ASSISTANT -->

    <div id="ai-assistant"></div>

    <script>

        fetch("components/ai-assistant.html")

            .then(response => response.text())

            .then(data => {

                document.getElementById(
                    "ai-assistant"
                ).innerHTML = data
            })
    </script>

    <link rel="stylesheet" href="css/ai-assistant.css">

    <script src="js/ai-assistant.js"></script>

</body>

</html>
