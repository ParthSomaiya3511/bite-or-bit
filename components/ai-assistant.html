<div class="ai-widget">

    <!-- TOGGLE -->

    <button id="ai-toggle">

        🤖

    </button>

    <!-- CHAT BOX -->

    <div class="ai-box" id="ai-box">

        <div class="ai-header">

            BiteOrbit AI Assistant

        </div>

        <!-- CHAT AREA -->

        <div class="ai-messages" id="ai-messages">

            <div class="ai-bot-message">

                Hello 👋
                How can I help you today?

            </div>

        </div>

        <!-- INPUT -->

        <div class="ai-input-area">

            <input
                type="text"
                id="ai-input"
                placeholder="Ask something..."
            >

            <button id="send-ai">

                Send

            </button>

        </div>

    </div>

</div>
