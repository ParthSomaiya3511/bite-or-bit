<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Success</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/loader.css">

    <link rel="stylesheet" href="../css/toast.css">

</head>

<body class="bg-dark text-white">

    <div id="loader-container"></div>

    <div id="toast-box"></div>

    <!-- <div id="header"></div> -->

    <section class="min-vh-100 d-flex align-items-center">

        <div class="container text-center">

            <div class="success-card mx-auto">

                <div class="success-icon">

                    ✅

                </div>

                <h1 class="fw-bold mt-4">

                    Payment Successful

                </h1>

                <p class="text-light mt-3">

                    Your delicious order is confirmed.
                </p>

                <div class="order-box mt-4">

                    <h4 class="fw-bold text-success">
                        <span id="success-order-id" class="text-warning"></span>

                    </h4>


                </div>

                <div class="mt-5 d-flex gap-3 justify-content-center">

                    <a id="track-btn" href="#" class="btn btn-success px-4">

                        Track Order

                    </a>


                    <a href="orders.html" class="btn btn-outline-light px-4">

                        My Orders

                    </a>

                </div>



            </div>

        </div>

    </section>

    <!-- <div id="footer"></div> -->

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script src="js/script.js"></script>

    <script src="js/payment.js"></script>

    <script src="../js/includes.js"></script>

    <script src="../js/loader.js"></script>

    <script src="../js/toast.js"></script>

    <script src="js/payment-success.js"></script>

    <!-- AI ASSISTANT -->

    <div id="ai-assistant"></div>

    <script>

        fetch("components/ai-assistant.html")

            .then(response => response.text())

            .then(data => {

                document.getElementById(
                    "ai-assistant"
                ).innerHTML = data
            })
    </script>

    <link rel="stylesheet" href="css/ai-assistant.css">

    <script src="js/ai-assistant.js"></script>

</body>

</html>
