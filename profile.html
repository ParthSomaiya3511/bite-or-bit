<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteOrbit | A Galaxy of Flavor</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Lexend (Modern & Premium) -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/loader.css">

    <link rel="stylesheet" href="../css/toast.css">

</head>

<body>

    <div id="loader-container"></div>

    <div id="toast-box"></div>

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-6">

                <div class="card border-0 shadow-lg rounded-4 p-4">

                    <div class="text-center mb-4">

                        <img id="profile-image" src="https://via.placeholder.com/120" class="rounded-circle mb-3"
                            width="120" height="120">

                        <h3 id="profile-username"></h3>

                        <p id="profile-email"></p>

                    </div>

                    <div class="mb-3">
                        <label>Mobile</label>
                        <input type="text" id="profile-mobile" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Address</label>
                        <textarea id="profile-address" class="form-control"></textarea>
                    </div>

                    <div class="mb-3">
                        <label>City</label>
                        <input type="text" id="profile-city" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Pincode</label>
                        <input type="text" id="profile-pincode" class="form-control">
                    </div>

                    <button class="btn btn-success w-100" onclick="updateProfile()">
                        Update Profile
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="js/script.js"></script>

    <script type="module" src="js/firebase.js"></script>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/includes.js"></script>

    <script src="../js/loader.js"></script>

    <script src="../js/toast.js"></script>

    <!-- AI ASSISTANT -->

    <div id="ai-assistant"></div>

    <script>

        fetch("components/ai-assistant.html")

            .then(response => response.text())

            .then(data => {

                document.getElementById(
                    "ai-assistant"
                ).innerHTML = data
            })
    </script>

    <link rel="stylesheet" href="css/ai-assistant.css">

    <script src="js/ai-assistant.js"></script>

</body>

</html>
