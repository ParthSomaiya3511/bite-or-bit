<!-- =========================================
restaurant-details.html
========================================= -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        BiteOrbit | Restaurant Details
    </title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/loader.css">

    <link rel="stylesheet" href="../css/toast.css">

</head>

<body class="dark-theme">

    <div id="loader-container"></div>

    <div id="toast-box"></div>

    <!-- HEADER -->
    <div id="header"></div>

    <!-- HERO -->
    <section class="restaurant-hero-section">

        <div class="hero-dark-overlay"></div>

        <img id="restaurant-image" class="restaurant-bg-image" src="">

        <div class="container position-relative">

            <div class="restaurant-hero-content">

                <div class="row align-items-center">

                    <div class="col-lg-8">

                        <div class="glass-restaurant-card">

                            <span class="premium-badge">

                                Premium Restaurant

                            </span>

                            <h1 id="restaurant-name" class="restaurant-title">
                            </h1>

                            <p id="restaurant-description" class="restaurant-desc">
                            </p>

                            <div class="restaurant-meta">

                                <div class="meta-box">

                                    ⭐
                                    <span id="restaurant-rating"></span>

                                </div>

                                <div class="meta-box">

                                    🚀
                                    <span id="restaurant-delivery"></span>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- FOODS -->
    <section class="foods-main-section py-5">

        <div class="container">

            <div class="row g-4">

                <!-- FOODS -->
                <div class="col-lg-8">

                    <div class="section-heading mb-4">

                        <h2>

                            Popular Dishes

                        </h2>

                        <p>

                            Delicious foods available now

                        </p>

                    </div>

                    <div id="foods-container"></div>

                </div>

                <!-- CART -->
                <div class="col-lg-4">

                    <div class="premium-cart-box">

                        <div class="cart-header">

                            <h3>

                                Your Cart

                            </h3>

                            <span id="cart-count" class="cart-count-badge">

                                0

                            </span>

                        </div>

                        <div id="cart-items" class="cart-scroll-area">

                        </div>

                        <div class="cart-footer-box">

                            <div class="d-flex
                                        justify-content-between
                                        align-items-center
                                        mb-3">

                                <h5 class="m-0">

                                    Total

                                </h5>

                                <h3 id="cart-total" class="m-0 text-success">

                                    ₹0

                                </h3>

                            </div>

                            <a href="checkout.html" class="btn btn-success w-100 py-3 rounded-pill fw-bold">

                                Proceed To Checkout

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- FOOTER -->
    <div id="footer"></div>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/script.js"></script>

    <script type="module" src="js/firebase.js"></script>

    <script src="../js/includes.js"></script>

    <script src="../js/loader.js"></script>

    <script src="../js/toast.js"></script>

    <!-- AI ASSISTANT -->

    <div id="ai-assistant"></div>

    <script>

        fetch("components/ai-assistant.html")

            .then(response => response.text())

            .then(data => {

                document.getElementById(
                    "ai-assistant"
                ).innerHTML = data
            })
    </script>

    <link rel="stylesheet" href="css/ai-assistant.css">

    <script src="js/ai-assistant.js"></script>

</body>

</html>
